name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - MainLicencias
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - MainLicencias

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build Application
        run: npm run build
        env:
          # Variables de entorno para el build
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_AUTH_LOGIN: ${{ secrets.VITE_AUTH_LOGIN }}
          VITE_USUARIOS_CREATE: ${{ secrets.VITE_USUARIOS_CREATE }}
          VITE_USUARIOS_GET_BY_ID: ${{ secrets.VITE_USUARIOS_GET_BY_ID }}
          VITE_USUARIOS_UPDATE: ${{ secrets.VITE_USUARIOS_UPDATE }}
          VITE_CATALOGOS_LOCALIDAD_POR_CP: ${{ secrets.VITE_CATALOGOS_LOCALIDAD_POR_CP }}
          VITE_CATALOGOS_CAT_DOCUMENTOS: ${{ secrets.VITE_CATALOGOS_CAT_DOCUMENTOS }}
          VITE_CATALOGOS_CAT_USUARIOS: ${{ secrets.VITE_CATALOGOS_CAT_USUARIOS }}
          VITE_DOCUMENTOS_CREATE: ${{ secrets.VITE_DOCUMENTOS_CREATE }}
          VITE_DOCUMENTOS_BY_USER: ${{ secrets.VITE_DOCUMENTOS_BY_USER }}
          VITE_DOCUMENTOS_BY_SOLICITUD: ${{ secrets.VITE_DOCUMENTOS_BY_SOLICITUD }}
          VITE_DOCUMENTOS_DOWNLOAD: ${{ secrets.VITE_DOCUMENTOS_DOWNLOAD }}
          VITE_DOCUMENTOS_UPDATE: ${{ secrets.VITE_DOCUMENTOS_UPDATE }}
          VITE_SOLICITUDES_CREATE: ${{ secrets.VITE_SOLICITUDES_CREATE }}
          VITE_SOLICITUDES_BY_USER: ${{ secrets.VITE_SOLICITUDES_BY_USER }}
          VITE_SOLICITUDES_GET_ALL: ${{ secrets.VITE_SOLICITUDES_GET_ALL }}
          VITE_SOLICITUDES_BY_ESTATUS: ${{ secrets.VITE_SOLICITUDES_BY_ESTATUS }}
          VITE_SOLICITUDES_UPDATE: ${{ secrets.VITE_SOLICITUDES_UPDATE }}
          VITE_REVISION_CREATE: ${{ secrets.VITE_REVISION_CREATE }}
          VITE_REVISION_BY_SOLICITUD: ${{ secrets.VITE_REVISION_BY_SOLICITUD }}
          VITE_REVISION_BY_REVISOR: ${{ secrets.VITE_REVISION_BY_REVISOR }}
          VITE_REVISION_CREATE_DOCUMENTOS: ${{ secrets.VITE_REVISION_CREATE_DOCUMENTOS }}
          VITE_REVISION_UPDATE_DOCUMENTO: ${{ secrets.VITE_REVISION_UPDATE_DOCUMENTO }}
          VITE_REVISION_DOCUMENTOS_BY_REVISION: ${{ secrets.VITE_REVISION_DOCUMENTOS_BY_REVISION }}
          VITE_REVISION_DOCUMENTOS_BY_DOCUMENTO: ${{ secrets.VITE_REVISION_DOCUMENTOS_BY_DOCUMENTO }}
          VITE_EXAM_OBTENER_PREGUNTAS: ${{ secrets.VITE_EXAM_OBTENER_PREGUNTAS }}
          VITE_EXAM_ENVIAR_RESPUESTAS: ${{ secrets.VITE_EXAM_ENVIAR_RESPUESTAS }}
          VITE_EXAM_VERIFICAR_RESULTADO: ${{ secrets.VITE_EXAM_VERIFICAR_RESULTADO }}
          VITE_EXAM_VERIFICAR_APROBACION: ${{ secrets.VITE_EXAM_VERIFICAR_APROBACION }}
          VITE_EXAM_OBTENER_POR_SOLICITUD: ${{ secrets.VITE_EXAM_OBTENER_POR_SOLICITUD }}
      
      - name: Deploy to Azure Static Web Apps
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          output_location: "dist"
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
